<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#235f4c">
  <title>上岸鸭 · 每日清单</title>
  <meta name="description" content="会给意外留出余地的备考任务清单。">
  <style>
    :root{--ink:#102d2c;--green:#27735d;--green-2:#155c49;--mint:#eaf2ed;--paper:#fbfcfa;--side:#eef3ed;--line:#d9e1dc;--muted:#788681;--amber:#d79526;--red:#c95c61;--blue:#748fb9;--shadow:0 15px 38px rgba(20,55,45,.07)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    button,input,select{font:inherit}button{color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;z-index:30}
    .brand{display:flex;align-items:center;gap:14px;padding:0 10px 18px;font-size:23px;font-weight:850;letter-spacing:-.02em}.logo{width:54px;height:54px;border-radius:17px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:serif;font-weight:900;font-size:20px}.sidebar-toggle{margin-left:auto;border:0;background:none;font-size:24px;color:#68766f;cursor:pointer}
    .quick{height:58px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--green),#2f8169);color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 9px 20px rgba(39,115,93,.15)}.quick span{font-size:27px;font-weight:300;margin-right:10px;vertical-align:-2px}
    .nav{display:grid;gap:5px;margin-top:26px}.nav button{height:49px;border:0;background:transparent;border-radius:13px;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:17px;cursor:pointer;text-align:left}.nav button:hover,.nav button.active{background:#dce9e2;color:var(--green-2);font-weight:800}.nav .ic{width:22px;text-align:center;font-size:19px;color:#697971}
    .list-title{margin:28px 16px 12px;padding-top:22px;border-top:1px solid var(--line);color:#718079;font-size:13px;font-weight:800}.side-list{display:grid;gap:8px}.side-list button{border:0;background:none;text-align:left;padding:6px 16px;font-size:15px;cursor:pointer}.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:11px}.return{margin-top:auto;border:0;background:none;text-align:left;padding:14px 16px;color:#52645e;font-size:16px;cursor:pointer}
    .main{min-width:0}.topbar{height:92px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 7%;gap:24px;position:sticky;top:0;z-index:20}.mobile-menu{display:none;border:0;background:none;font-size:24px}.search{height:56px;max-width:630px;flex:1;border:1px solid var(--line);background:#f5f7f4;border-radius:15px;display:flex;align-items:center;padding:0 20px;gap:12px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:17px}.search input::placeholder{color:#adb7b2}.top-actions{margin-left:auto;display:flex;align-items:center;gap:18px}.countdown,.icon-btn,.avatar{height:52px;border:1px solid var(--line);background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center}.countdown{padding:0 18px;gap:11px;font-size:16px}.countdown b{color:#b67b1e}.icon-btn{width:50px;cursor:pointer}.avatar{width:50px;border-radius:50%;background:var(--green);color:#fff;border:0}
    .content{max-width:1320px;margin:0 auto;padding:56px 54px 90px}.eyebrow{color:var(--amber);font-size:13px;font-weight:900;letter-spacing:.22em}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:30px}.hero h1{font:500 clamp(31px,3vw,42px)/1.2 Georgia,"Songti SC",serif;margin:18px 0 14px;letter-spacing:.01em}.hero p{margin:0;color:#768580;font-size:16px}.ai-btn{border:0;border-radius:999px;background:var(--green);color:#fff;padding:17px 26px;font-weight:850;cursor:pointer;box-shadow:0 14px 28px rgba(39,115,93,.17)}
    .viewbar{margin-top:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}.segments{display:flex;background:#e8eeea;border-radius:15px;padding:4px}.segments button{border:0;background:transparent;min-width:46px;height:39px;border-radius:11px;font-size:16px;cursor:pointer}.segments button.active{background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.12);font-weight:750}.date-tools{display:flex;align-items:center;gap:12px}.date-switch{height:48px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:0 13px;display:flex;align-items:center;gap:16px;font-weight:800}.date-switch button{border:0;background:none;font-size:23px;cursor:pointer}.tool{width:45px;height:45px;border:0;background:transparent;border-radius:12px;font-size:20px;color:#718079;cursor:pointer}.tool:hover,.tool.active{background:var(--mint);color:var(--green)}
    .menu{position:absolute;right:0;top:54px;width:220px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:var(--shadow);display:none;z-index:25}.menu.open{display:grid}.menu button{border:0;background:#fff;padding:11px 13px;border-radius:9px;text-align:left;cursor:pointer}.menu button:hover{background:var(--mint)}.menu .danger{color:var(--red)}
    .capacity{margin-top:20px;background:#eff5f1;border:1px solid #d7e5dd;border-radius:18px;min-height:88px;padding:20px 26px;display:flex;align-items:center;gap:20px}.capacity label{font-size:18px;white-space:nowrap}.capacity select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px}.bar{height:10px;max-width:360px;flex:1;background:#cfe0d7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:69%;background:var(--green)}.cap-n{font-weight:900;white-space:nowrap}.cap-note{color:#7c8a84;white-space:nowrap}
    .dashboard{margin-top:32px;display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,.95fr);gap:28px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.tasks-card{padding:26px 28px;min-height:410px}.card-head{display:flex;align-items:center;border-bottom:1px solid #edf0ee;padding-bottom:18px}.card-head h2{font:500 23px Georgia,"Songti SC",serif;margin:0}.badge{background:#eff3f0;border-radius:99px;padding:4px 9px;font-size:12px;color:#82908b;margin-left:8px}.add-task{margin-left:auto;border:0;background:none;color:var(--green);font-weight:850;font-size:16px;cursor:pointer}.add-task span{font-size:25px;font-weight:300;vertical-align:-2px;margin-right:6px}
    .task-list{overflow:hidden}.task-wrap{position:relative;border-bottom:1px solid #eef1ef}.task-wrap:last-child{border:0}.delete-back{position:absolute;right:0;inset-block:0;width:118px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:850}.task{position:relative;background:#fff;display:grid;grid-template-columns:42px 36px minmax(0,1fr) auto auto;align-items:center;gap:11px;padding:18px 0;transition:transform .2s ease,opacity .2s ease;touch-action:pan-y;user-select:none}.task.dragging{transition:none}.num{color:#bcc6c1;font-size:13px}.check{width:31px;height:31px;border:0;background:#f3f8f5;border-radius:10px;color:#77a793;font-size:18px;cursor:pointer}.task-title{font-size:16px;font-weight:780;margin-bottom:5px}.meta{font-size:12px;color:#a4aea9}.task .start{border:0;background:#f4f8f6;color:#86ad9d;border-radius:12px;padding:10px 15px;cursor:pointer}.row-menu{border:0;background:none;color:#8b9893;font-size:21px;cursor:pointer;padding:8px}.task.completed{opacity:.47}.task.completed .task-title{text-decoration:line-through}.task.running{box-shadow:inset 4px 0 var(--amber)}.task.compact{padding:10px 0}.task.compact .meta{display:none}.task.compact .start{padding:7px 12px}
    .empty{display:none;text-align:center;padding:70px 20px;color:#82908a}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}
    .side-stack{display:grid;gap:24px}.tip{padding:30px 32px}.cup{color:var(--amber);font-size:24px}.tip h3{font:500 28px Georgia,"Songti SC",serif;margin:11px 0}.tip p{color:#768580;line-height:1.7;margin:0}.opportunity{padding:28px 32px}.opportunity .card-head{padding-bottom:14px}.op-item{display:flex;gap:14px;padding-top:20px}.clock{width:26px;height:26px;border:2px solid #9aa8a2;border-radius:50%;display:grid;place-items:center;color:#8a9892;font-size:12px}.op-item b{font-size:15px}.op-item small{display:block;color:#87958f;margin-top:5px}
    .overlay{position:fixed;inset:0;background:rgba(12,34,29,.36);display:none;align-items:center;justify-content:center;padding:18px;z-index:80}.overlay.open{display:flex}.modal{width:min(570px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(10,35,27,.24);padding:27px}.modal-head{display:flex;align-items:center}.modal-head h2{font:600 26px Georgia,"Songti SC",serif;margin:0}.close{margin-left:auto;border:0;background:#f1f4f2;border-radius:50%;width:38px;height:38px;cursor:pointer}.steps{display:flex;gap:9px;margin:23px 0}.steps i{height:5px;flex:1;border-radius:99px;background:#e6ebe8}.steps i.on{background:var(--green)}.step-title{font-weight:850;margin-bottom:15px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:14px;font-weight:760}.required{color:var(--red)}.field input,.field select{width:100%;border:1px solid #d6dfda;background:#fbfcfb;border-radius:12px;padding:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(39,115,93,.09)}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice label{border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer}.choice label:has(input:checked){border-color:var(--green);background:var(--mint)}.choice input{width:auto;margin-right:7px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary,.primary{border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer}.secondary{background:#edf2ef}.primary{background:var(--green);color:#fff}.hint{font-size:12px;color:#7f8d87;margin-top:-7px;margin-bottom:14px}.error{color:var(--red);font-size:13px;min-height:18px}
    .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);opacity:0;background:#173d33;color:#fff;border-radius:13px;padding:13px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;z-index:100;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast button{border:0;background:none;color:#f3c46b;font-weight:850;cursor:pointer}.scrim{display:none}
    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;width:280px;transition:left .25s}.sidebar.open{left:0}.scrim.open{display:block;position:fixed;inset:0;background:#0006;z-index:29}.topbar{height:72px;padding:0 18px}.mobile-menu{display:block}.countdown{display:none}.content{padding:34px 20px 72px}.dashboard{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.hero-row{align-items:start}.capacity{flex-wrap:wrap}.bar{order:5;flex-basis:100%;max-width:none}}
    @media(max-width:650px){.top-actions .icon-btn{display:none}.search{height:46px}.hero-row{display:block}.ai-btn{margin-top:22px}.viewbar{align-items:flex-start}.segments button{min-width:39px}.date-switch{height:44px;gap:7px;font-size:13px;padding:0 6px}.date-tools{gap:2px}.capacity{padding:16px}.cap-note{display:none}.tasks-card{padding:19px 16px}.task{grid-template-columns:26px 32px minmax(0,1fr) auto;gap:8px}.task .start{display:none}.row-menu{padding:6px}.side-stack{grid-template-columns:1fr}.choice{grid-template-columns:1fr}.tip,.opportunity{padding:24px}.tool{width:38px}.hero h1{font-size:31px}.hero p{line-height:1.6}}
  </style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">鸭</div>上岸鸭<button class="sidebar-toggle" id="closeSide" aria-label="收起侧栏">☰</button></div>
    <button class="quick" data-add="inbox"><span>＋</span>快速收集</button>
    <nav class="nav" aria-label="主导航">
      <button data-page="收集箱"><span class="ic">▣</span>收集箱</button>
      <button class="active" data-page="每日清单"><span class="ic">☷</span>每日清单</button>
      <button data-page="番茄钟"><span class="ic">◴</span>番茄钟</button>
      <button data-page="习惯"><span class="ic">♧</span>习惯</button>
      <button data-page="数据档案"><span class="ic">▥</span>数据档案</button>
      <button data-page="我的"><span class="ic">♙</span>我的</button>
      <button data-page="四象限"><span class="ic">⊞</span>四象限</button>
    </nav>
    <div class="list-title">我的清单</div>
    <div class="side-list" id="sideLists"></div>
    <button class="return">←　返回封面</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="打开侧栏">☰</button>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="搜索任务、习惯或数据" aria-label="搜索任务"></label>
      <div class="top-actions"><div class="countdown">◎ 距离考研 <b>472</b> 天</div><button class="icon-btn" id="bell" aria-label="通知">♧</button><div class="avatar">半</div></div>
    </header>
    <div class="content">
      <section class="hero"><div class="eyebrow" id="todayLabel">TODAY · 2026.09.02</div><div class="hero-row"><div><h1>今天别排满，留一点给意外</h1><p>AI 排程按你的可用时间和缓冲自动分出“今天”与“机动”。</p></div><button class="ai-btn" id="aiSchedule">✣　AI 一键排程</button></div></section>
      <div class="viewbar">
        <div class="segments" id="views"><button class="active">列表</button><button>日</button><button>3日</button><button>周</button><button>月</button></div>
        <div class="date-tools"><div class="date-switch"><button id="prevDay" aria-label="前一天">‹</button><span id="dateText">9月2日 周三</span><button id="nextDay" aria-label="后一天">›</button></div><button class="tool" id="layoutToggle" aria-label="切换任务密度" title="切换任务密度">▥</button><button class="tool" id="moreToggle" aria-label="更多操作" title="更多操作">•••</button></div>
        <div class="menu" id="moreMenu"><button id="toggleCompleted">隐藏已完成任务</button><button id="completeAll">全部标记完成</button><button class="danger" id="clearCompleted">清除已完成任务</button></div>
      </div>
      <section class="capacity"><label>今天可以投入</label><select id="capacityHours" aria-label="今天可投入小时"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option></select><div class="bar"><i id="capBar"></i></div><div class="cap-n"><span id="usedMinutes">207</span> / <span id="totalMinutes">300</span> 分钟</div><div class="cap-note">已自动留出缓冲</div></section>
      <div class="dashboard">
        <section class="card tasks-card"><div class="card-head"><h2>今天</h2><span class="badge" id="taskCount">3</span><button class="add-task" data-add="today"><span>＋</span>添加任务</button></div><div class="task-list" id="taskList"></div><div class="empty" id="empty"><strong>今天还没有任务</strong>先添加一件最重要的事。</div></section>
        <aside class="side-stack"><section class="card tip"><div class="cup">♨</div><h3>先做 5 分钟。</h3><p>启动后上岸鸭会轻轻问一次状态，不需要现在保证整段时间都完美。</p></section><section class="card opportunity"><div class="card-head"><h2>机动</h2><span class="badge">1</span></div><div class="op-item"><div class="clock">◷</div><div><b>完善 Vibe Coding 作品</b><small>建议 100 分钟 · 明天重新确认</small></div></div></section></aside>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="taskOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal" id="taskForm"><div class="modal-head"><h2 id="modalTitle">添加任务</h2><button type="button" class="close" id="closeModal" aria-label="关闭">×</button></div><div class="steps"><i class="on"></i><i></i></div>
    <section id="stepOne"><div class="step-title">第 1 步：先确定任务层级</div><div class="field"><label>任务层级 <span class="required">*</span></label><div class="choice"><label><input type="radio" name="level" value="main">主任务<br><span class="hint">独立完成的一件事</span></label><label><input type="radio" name="level" value="sub">子任务<br><span class="hint">属于某个主任务</span></label></div></div><div class="field"><label for="listSelect">所属清单 <span class="required">*</span></label><select id="listSelect"><option value="">请选择清单</option></select></div><div class="field" id="parentField" hidden><label for="parentSelect">所属主任务 <span class="required">*</span></label><select id="parentSelect"><option value="">请选择主任务</option></select></div><div class="error" id="stepError"></div><div class="modal-actions"><button type="button" class="primary" id="nextStep">下一步</button></div></section>
    <section id="stepTwo" hidden><div class="step-title">第 2 步：填写任务内容</div><div class="field"><label for="taskName">任务名称 <span class="required">*</span></label><input id="taskName" maxlength="40" placeholder="例如：拆解 Agent 产品案例"></div><div class="field"><label for="duration">预计时长</label><select id="duration"><option value="25">25 分钟</option><option value="45" selected>45 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option><option value="120">120 分钟</option></select></div><div class="field"><label for="priority">重要程度</label><select id="priority"><option value="normal">普通任务</option><option value="important">重要任务</option></select></div><div class="error" id="formError"></div><div class="modal-actions"><button type="button" class="secondary" id="prevStepBtn">上一步</button><button type="submit" class="primary">添加到今天</button></div></section>
  </form>
</div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undoBtn" hidden>撤销</button></div>
<script>
(() => {
  const LISTS=[{id:'ai',name:'AI 产品经理',color:'#2d8b6c'},{id:'exam',name:'考研准备',color:'#d89a35'},{id:'ops',name:'运营实战',color:'#7893bd'},{id:'side',name:'副业作业',color:'#c86b72'}];
  const DEFAULT_TASKS=[
    {id:1,title:'拆解 Agent 产品案例',list:'ai',level:'main',parent:'',duration:90,completed:true,priority:'important'},
    {id:2,title:'应用统计专业课：概率论',list:'exam',level:'main',parent:'',duration:78,completed:true,priority:'normal'},
    {id:3,title:'复盘小红书内容数据',list:'ops',level:'main',parent:'',duration:39,completed:true,priority:'normal'}
  ];
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  let tasks=load('shangan_tasks',DEFAULT_TASKS), selectedDate=new Date(2026,8,2), compact=load('shangan_compact',false), hideCompleted=false, lastDeleted=null, toastTimer;
  function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}
  function save(){localStorage.setItem('shangan_tasks',JSON.stringify(tasks));localStorage.setItem('shangan_compact',JSON.stringify(compact))}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function listFor(id){return LISTS.find(x=>x.id===id)||LISTS[0]}
  function renderLists(){ $('#sideLists').innerHTML=LISTS.map(l=>`<button data-filter="${l.id}"><i class="dot" style="background:${l.color}"></i>${l.name}</button>`).join(''); $('#listSelect').innerHTML='<option value="">请选择清单</option>'+LISTS.map(l=>`<option value="${l.id}">${l.name}</option>`).join('') }
  function renderParents(){const list=$('#listSelect').value;const mains=tasks.filter(t=>t.level==='main'&&(!list||t.list===list));$('#parentSelect').innerHTML='<option value="">请选择主任务</option>'+mains.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}
  function render(){
    const q=$('#searchInput').value.trim().toLowerCase();let shown=tasks.filter(t=>(!hideCompleted||!t.completed)&&(!q||t.title.toLowerCase().includes(q)||listFor(t.list).name.includes(q)));
    $('#taskList').innerHTML=shown.map((t,i)=>{const list=listFor(t.list),parent=t.parent?tasks.find(x=>String(x.id)===String(t.parent)):null;return `<div class="task-wrap" data-id="${t.id}"><div class="delete-back">删除</div><article class="task ${t.completed?'completed':''} ${t.running?'running':''} ${compact?'compact':''}"><div class="num">${String(i+1).padStart(2,'0')}</div><button class="check" data-action="check" aria-label="${t.completed?'取消完成':'完成任务'}">${t.completed?'✓':'○'}</button><div><div class="task-title">${t.level==='sub'?'↳ ':''}${esc(t.title)}${t.priority==='important'?' <span style="color:#b45b60">· 重点</span>':''}</div><div class="meta"><i class="dot" style="background:${list.color};margin-right:6px"></i>${list.name} · ${t.duration} 分钟${parent?' · 属于 '+esc(parent.title):''}</div></div><button class="start" data-action="start">${t.running?'暂停':'▷ 开始'}</button><button class="row-menu" data-action="delete" aria-label="删除任务" title="删除任务">⋯</button></article></div>`}).join('');
    $('#taskCount').textContent=tasks.length;$('#empty').style.display=shown.length?'none':'block';updateCapacity();attachSwipes();
  }
  function updateCapacity(){const total=Number($('#capacityHours').value)*60,used=tasks.reduce((s,t)=>s+t.duration,0);$('#totalMinutes').textContent=total;$('#usedMinutes').textContent=used;$('#capBar').style.width=Math.min(100,Math.round(used/total*100))+'%';$('#capBar').style.background=used>total?'var(--red)':'var(--green)'}
  function showToast(text,undo=false){clearTimeout(toastTimer);$('#toastText').textContent=text;$('#undoBtn').hidden=!undo;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
  function removeTask(id){const idx=tasks.findIndex(t=>String(t.id)===String(id));if(idx<0)return;lastDeleted={task:tasks[idx],index:idx};tasks.splice(idx,1);save();render();showToast('任务已删除',true)}
  function attachSwipes(){ $$('.task-wrap').forEach(w=>{const row=w.querySelector('.task');let startX=0,startY=0,dx=0,drag=false;row.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;startX=e.clientX;startY=e.clientY;dx=0;drag=true;row.setPointerCapture?.(e.pointerId)});row.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-startY;dx=e.clientX-startX;if(Math.abs(dy)>Math.abs(dx)+10){drag=false;row.style.transform='';return}if(dx<0){row.classList.add('dragging');row.style.transform=`translateX(${Math.max(dx,-132)}px)`}});const end=()=>{if(!drag)return;drag=false;row.classList.remove('dragging');if(dx<-92){row.style.transform='translateX(-100%)';row.style.opacity='0';setTimeout(()=>removeTask(w.dataset.id),180)}else row.style.transform=''};row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end)}) }
  function resetModal(defaultList=''){ $('#taskForm').reset();$('#listSelect').value=defaultList==='inbox'?'':defaultList;$('#stepOne').hidden=false;$('#stepTwo').hidden=true;$$('.steps i')[0].classList.add('on');$$('.steps i')[1].classList.remove('on');$('#parentField').hidden=true;$('#stepError').textContent='';$('#formError').textContent='';renderParents() }
  function openModal(source){resetModal(source==='today'?'':source);$('#taskOverlay').classList.add('open');setTimeout(()=>$('#taskOverlay input[name="level"]')?.focus(),50)}
  function closeModal(){ $('#taskOverlay').classList.remove('open') }
  function updateDate(){const w=['周日','周一','周二','周三','周四','周五','周六'];$('#dateText').textContent=`${selectedDate.getMonth()+1}月${selectedDate.getDate()}日 ${w[selectedDate.getDay()]}`;$('#todayLabel').textContent=`TODAY · ${selectedDate.getFullYear()}.${String(selectedDate.getMonth()+1).padStart(2,'0')}.${String(selectedDate.getDate()).padStart(2,'0')}`}
  renderLists();render();updateDate();
  $$('[data-add]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.add)));
  $('#closeModal').addEventListener('click',closeModal);$('#taskOverlay').addEventListener('click',e=>{if(e.target===$('#taskOverlay'))closeModal()});
  $$('input[name="level"]').forEach(r=>r.addEventListener('change',()=>{$('#parentField').hidden=r.value!=='sub';renderParents()}));$('#listSelect').addEventListener('change',renderParents);
  $('#nextStep').addEventListener('click',()=>{const level=$('input[name="level"]:checked')?.value,list=$('#listSelect').value;if(!level||!list){$('#stepError').textContent='请先选择任务层级和所属清单。';return}if(level==='sub'&&!$('#parentSelect').value){$('#stepError').textContent='子任务必须选择所属主任务。';return}$('#stepError').textContent='';$('#stepOne').hidden=true;$('#stepTwo').hidden=false;$$('.steps i')[1].classList.add('on');$('#taskName').focus()});
  $('#prevStepBtn').addEventListener('click',()=>{$('#stepTwo').hidden=true;$('#stepOne').hidden=false;$$('.steps i')[1].classList.remove('on')});
  $('#taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#taskName').value.trim();if(!title){$('#formError').textContent='请输入任务名称。';return}const level=$('input[name="level"]:checked').value;tasks.push({id:Date.now(),title,list:$('#listSelect').value,level,parent:level==='sub'?$('#parentSelect').value:'',duration:Number($('#duration').value),priority:$('#priority').value,completed:false});save();render();closeModal();showToast('任务已添加到今天')});
  $('#taskList').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const id=btn.closest('.task-wrap').dataset.id,t=tasks.find(x=>String(x.id)===id);if(btn.dataset.action==='delete'){removeTask(id);return}if(btn.dataset.action==='check')t.completed=!t.completed;if(btn.dataset.action==='start'){tasks.forEach(x=>{if(x!==t)x.running=false});t.running=!t.running;showToast(t.running?'已开始专注':'已暂停任务')}save();render()});
  $('#undoBtn').addEventListener('click',()=>{if(!lastDeleted)return;tasks.splice(lastDeleted.index,0,lastDeleted.task);lastDeleted=null;save();render();showToast('已恢复任务')});
  $('#layoutToggle').addEventListener('click',()=>{compact=!compact;$('#layoutToggle').classList.toggle('active',compact);save();render();showToast(compact?'已切换为紧凑视图':'已切换为舒展视图')});
  $('#moreToggle').addEventListener('click',e=>{e.stopPropagation();$('#moreMenu').classList.toggle('open')});document.addEventListener('click',e=>{if(!e.target.closest('#moreMenu'))$('#moreMenu').classList.remove('open')});
  $('#toggleCompleted').addEventListener('click',()=>{hideCompleted=!hideCompleted;$('#toggleCompleted').textContent=hideCompleted?'显示已完成任务':'隐藏已完成任务';render()});$('#completeAll').addEventListener('click',()=>{tasks.forEach(t=>t.completed=true);save();render();showToast('今天的任务已全部完成')});$('#clearCompleted').addEventListener('click',()=>{const n=tasks.filter(t=>t.completed).length;tasks=tasks.filter(t=>!t.completed);save();render();showToast(`已清除 ${n} 个已完成任务`)});
  $('#views').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;$$('#views button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');showToast(`已切换到${e.target.textContent}视图`)});$('#prevDay').addEventListener('click',()=>{selectedDate.setDate(selectedDate.getDate()-1);updateDate()});$('#nextDay').addEventListener('click',()=>{selectedDate.setDate(selectedDate.getDate()+1);updateDate()});$('#capacityHours').addEventListener('change',updateCapacity);$('#searchInput').addEventListener('input',render);
  $('#aiSchedule').addEventListener('click',()=>{tasks.sort((a,b)=>(b.priority==='important')-(a.priority==='important')||a.completed-b.completed);save();render();showToast('已按重要程度重新排程')});$('#bell').addEventListener('click',()=>showToast('暂时没有新提醒'));
  $$('.nav button').forEach(b=>b.addEventListener('click',()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast(`${b.dataset.page}功能已响应`)}));$('#sideLists').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#searchInput').value=listFor(b.dataset.filter).name;render();showToast(`正在查看${listFor(b.dataset.filter).name}`)});
  function closeSide(){ $('#sidebar').classList.remove('open');$('#scrim').classList.remove('open') }$('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open')});$('#closeSide').addEventListener('click',closeSide);$('#scrim').addEventListener('click',closeSide);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSide();$('#moreMenu').classList.remove('open')}});
})();
</script>
</body>
</html>
