<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能学习计划 - 注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        .screen {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .screen.active {
            display: block;
        }

        .startup-screen {
            text-align: center;
            padding: 60px 30px;
        }

        .startup-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin: 20px 0 10px;
            font-weight: 600;
        }

        .startup-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .skip-btn {
            background: transparent;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 10px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .verification-code {
            display: flex;
            gap: 10px;
        }

        .verification-code input {
            flex: 1;
        }

        .verification-code button {
            width: 120px;
            padding: 12px;
            font-size: 0.8rem;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.8rem;
        }

        .password-strength.weak {
            color: var(--danger-color);
        }

        .password-strength.medium {
            color: var(--warning-color);
        }

        .password-strength.strong {
            color: var(--success-color);
        }

        .third-party-login {
            margin: 30px 0;
        }

        .third-party-title {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
            position: relative;
        }

        .third-party-title::before,
        .third-party-title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: var(--border-color);
        }

        .third-party-title::before {
            left: 0;
        }

        .third-party-title::after {
            right: 0;
        }

        .third-party-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .third-party-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .third-party-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .agreement {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .agreement input {
            width: 16px;
            height: 16px;
        }

        .agreement a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .agreement a:hover {
            text-decoration: underline;
        }

        .visitor-mode {
            text-align: center;
            margin-top: 20px;
        }

        .visitor-mode button {
            background: transparent;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .modal-message {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .info-step {
            text-align: center;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
        }

        .step-dot.active {
            background: var(--primary-color);
            width: 20px;
            border-radius: 10px;
        }

        .step-question {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .option-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
        }

        .multi-option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .multi-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .multi-option:hover {
            border-color: var(--primary-color);
        }

        .multi-option.selected {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .multi-option input {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .screen {
                padding: 20px;
            }
            
            .option-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 启动页 -->
    <div class="container">
        <div class="screen active" id="startup-screen">
            <div class="startup-screen">
                <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 20px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold;">AI</div>
                <h2 class="startup-title">AI智能学习计划</h2>
                <p class="startup-subtitle">AI帮你排计划，告别拖延，高效完成目标</p>
                <button class="skip-btn" id="skip-startup">跳过启动页</button>
            </div>
        </div>

        <!-- 注册/登录页面 -->
        <div class="screen" id="auth-screen">
            <div class="auth-header">
                <h2 class="auth-title">欢迎使用AI智能学习计划</h2>
                <p class="auth-subtitle">新用户注册，1分钟完成，立即获取专属AI学习计划</p>
            </div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="register">注册</div>
                <div class="auth-tab" data-tab="login">登录</div>
            </div>

            <!-- 注册表单 -->
            <div class="auth-content" id="register-content">
                <!-- 手机号注册 -->
                <div class="register-method active" id="phone-register">
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-input" placeholder="请输入手机号" id="phone-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <div class="verification-code">
                            <input type="text" class="form-input" placeholder="请输入验证码" id="code-input">
                            <button class="btn btn-outline" id="get-code">获取验证码</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">设置密码</label>
                        <input type="password" class="form-input" placeholder="6-18位，字母+数字" id="password-input">
                        <div class="password-strength" id="password-strength">密码强度：请设置密码</div>
                    </div>
                    <div class="agreement">
                        <input type="checkbox" id="agreement" checked>
                        <label for="agreement">同意<a href="#">用户协议</a>和<a href="#">隐私政策</a>（数据仅用于AI计划制定）</label>
                    </div>
                    <button class="btn btn-primary" id="register-btn">立即注册</button>
                </div>

                <!-- 校园账号注册 -->
                <div class="register-method" id="campus-register">
                    <div class="form-group">
                        <label class="form-label">选择高校</label>
                        <input type="text" class="form-input" placeholder="请输入学校名称" id="school-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">教务系统账号</label>
                        <input type="text" class="form-input" placeholder="请输入教务系统账号" id="campus-username">
                    </div>
                    <div class="form-group">
                        <label class="form-label">教务系统密码</label>
                        <input type="password" class="form-input" placeholder="请输入教务系统密码" id="campus-password">
                    </div>
                    <div class="agreement">
                        <input type="checkbox" id="campus-agreement" checked>
                        <label for="campus-agreement">同意<a href="#">用户协议</a>和<a href="#">隐私政策</a>（仅验证身份）</label>
                    </div>
                    <button class="btn btn-primary" id="campus-register-btn">校园账号注册</button>
                </div>

                <div class="third-party-login">
                    <div class="third-party-title">其他注册方式</div>
                    <div class="third-party-buttons">
                        <div class="third-party-btn" id="wechat-login">
                            <span style="font-size: 1.5rem;">💬</span>
                        </div>
                        <div class="third-party-btn" id="qq-login">
                            <span style="font-size: 1.5rem;">🐧</span>
                        </div>
                    </div>
                </div>

                <div class="visitor-mode">
                    <button id="visitor-mode">先体验，后注册</button>
                </div>
            </div>

            <!-- 登录表单 -->
            <div class="auth-content" id="login-content" style="display: none;">
                <div class="form-group">
                    <label class="form-label">手机号/账号</label>
                    <input type="text" class="form-input" placeholder="请输入手机号或账号">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary">立即登录</button>
                <div class="visitor-mode">
                    <button id="login-visitor-mode">先体验，后注册</button>
                </div>
            </div>
        </div>

        <!-- 信息补充页面 -->
        <div class="screen" id="info-screen">
            <div class="info-step">
                <div class="step-indicator">
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                    <div class="step-dot"></div>
                    <div class="step-dot"></div>
                </div>
                
                <!-- 第一步：年级 -->
                <div class="step-content active" id="step-1">
                    <h3 class="step-question">你目前的年级是？</h3>
                    <div class="option-group">
                        <button class="option-btn" data-grade="大一">大一</button>
                        <button class="option-btn" data-grade="大二">大二</button>
                        <button class="option-btn" data-grade="大三">大三</button>
                        <button class="option-btn" data-grade="大四">大四</button>
                        <button class="option-btn" data-grade="其他" style="grid-column: 1 / -1;">其他（如专升本）</button>
                    </div>
                    <button class="btn btn-primary" id="next-step-1">下一步</button>
                </div>

                <!-- 第二步：学习目标 -->
                <div class="step-content" id="step-2" style="display: none;">
                    <h3 class="step-question">你当前的核心学习目标有哪些？</h3>
                    <div class="multi-option-group">
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="专业课提升">
                            <span>专业课提升</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="考研备考">
                            <span>考研备考</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="四六级备考">
                            <span>四六级备考</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="考证">
                            <span>考证（如教资、计算机）</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="竞赛准备">
                            <span>竞赛准备</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="实习相关学习">
                            <span>实习相关学习</span>
                        </div>
                        <div class="multi-option">
                            <input type="checkbox" name="goals" value="其他">
                            <span>其他</span>
                        </div>
                    </div>
                    <div class="btn-group" style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" id="prev-step-2">上一步</button>
                        <button class="btn btn-primary" id="next-step-2">完成</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册成功弹窗 -->
    <div class="modal" id="success-modal">
        <div class="modal-content">
            <h3 class="modal-title">注册成功</h3>
            <p class="modal-message">恭喜你，立即完善个人信息，获取专属AI学习计划</p>
            <div class="modal-buttons">
                <button class="btn btn-outline" id="later完善">稍后完善</button>
                <button class="btn btn-primary" id="now完善">立即完善</button>
            </div>
        </div>
    </div>

    <script>
        // 启动页倒计时
        let countdown = 3;
        const startupScreen = document.getElementById('startup-screen');
        const authScreen = document.getElementById('auth-screen');
        const skipStartup = document.getElementById('skip-startup');

        const countdownInterval = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                startupScreen.classList.remove('active');
                authScreen.classList.add('active');
            }
        }, 1000);

        skipStartup.addEventListener('click', () => {
            clearInterval(countdownInterval);
            startupScreen.classList.remove('active');
            authScreen.classList.add('active');
        });

        // 注册/登录切换
        const authTabs = document.querySelectorAll('.auth-tab');
        const registerContent = document.getElementById('register-content');
        const loginContent = document.getElementById('login-content');

        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                authTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                if (tab.dataset.tab === 'register') {
                    registerContent.style.display = 'block';
                    loginContent.style.display = 'none';
                } else {
                    registerContent.style.display = 'none';
                    loginContent.style.display = 'block';
                }
            });
        });

        // 验证码倒计时
        const getCodeBtn = document.getElementById('get-code');
        getCodeBtn.addEventListener('click', () => {
            const phoneInput = document.getElementById('phone-input');
            if (!phoneInput.value) {
                alert('请输入手机号');
                return;
            }
            
            let seconds = 60;
            getCodeBtn.disabled = true;
            getCodeBtn.textContent = `${seconds}秒后重新获取`;
            
            const codeInterval = setInterval(() => {
                seconds--;
                getCodeBtn.textContent = `${seconds}秒后重新获取`;
                if (seconds <= 0) {
                    clearInterval(codeInterval);
                    getCodeBtn.disabled = false;
                    getCodeBtn.textContent = '获取验证码';
                }
            }, 1000);
            
            // 模拟发送验证码
            alert('验证码已发送');
        });

        // 密码强度检测
        const passwordInput = document.getElementById('password-input');
        const passwordStrength = document.getElementById('password-strength');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 'weak';
            let message = '密码强度：弱';
            
            if (password.length >= 6) {
                if (password.match(/[a-zA-Z]/) && password.match(/[0-9]/)) {
                    strength = 'strong';
                    message = '密码强度：强';
                } else {
                    strength = 'medium';
                    message = '密码强度：中';
                }
            }
            
            passwordStrength.className = `password-strength ${strength}`;
            passwordStrength.textContent = message;
        });

        // 注册按钮点击
        const registerBtn = document.getElementById('register-btn');
        const successModal = document.getElementById('success-modal');

        registerBtn.addEventListener('click', () => {
            const phoneInput = document.getElementById('phone-input');
            const codeInput = document.getElementById('code-input');
            const passwordInput = document.getElementById('password-input');
            const agreement = document.getElementById('agreement');
            
            if (!phoneInput.value) {
                alert('请输入手机号');
                return;
            }
            if (!codeInput.value) {
                alert('请输入验证码');
                return;
            }
            if (!passwordInput.value) {
                alert('请设置密码');
                return;
            }
            if (!agreement.checked) {
                alert('请同意用户协议和隐私政策');
                return;
            }
            
            // 模拟注册成功
            successModal.classList.add('active');
        });

        // 校园账号注册
        const campusRegisterBtn = document.getElementById('campus-register-btn');
        campusRegisterBtn.addEventListener('click', () => {
            const schoolInput = document.getElementById('school-input');
            const campusUsername = document.getElementById('campus-username');
            const campusPassword = document.getElementById('campus-password');
            const campusAgreement = document.getElementById('campus-agreement');
            
            if (!schoolInput.value) {
                alert('请输入学校名称');
                return;
            }
            if (!campusUsername.value) {
                alert('请输入教务系统账号');
                return;
            }
            if (!campusPassword.value) {
                alert('请输入教务系统密码');
                return;
            }
            if (!campusAgreement.checked) {
                alert('请同意用户协议和隐私政策');
                return;
            }
            
            // 模拟注册成功
            successModal.classList.add('active');
        });

        // 第三方登录
        document.getElementById('wechat-login').addEventListener('click', () => {
            alert('微信授权登录');
            successModal.classList.add('active');
        });

        document.getElementById('qq-login').addEventListener('click', () => {
            alert('QQ授权登录');
            successModal.classList.add('active');
        });

        // 游客模式
        document.getElementById('visitor-mode').addEventListener('click', () => {
            alert('进入游客模式');
        });

        document.getElementById('login-visitor-mode').addEventListener('click', () => {
            alert('进入游客模式');
        });

        // 注册成功弹窗
        document.getElementById('later完善').addEventListener('click', () => {
            successModal.classList.remove('active');
            alert('进入APP首页');
        });

        document.getElementById('now完善').addEventListener('click', () => {
            successModal.classList.remove('active');
            authScreen.classList.remove('active');
            document.getElementById('info-screen').classList.add('active');
        });

        // 信息补充步骤
        let currentStep = 1;
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const stepDots = document.querySelectorAll('.step-dot');

        // 年级选择
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        // 学习目标选择
        document.querySelectorAll('.multi-option').forEach(option => {
            option.addEventListener('click', () => {
                const checkbox = option.querySelector('input');
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
        });

        // 下一步
        document.getElementById('next-step-1').addEventListener('click', () => {
            const selectedGrade = document.querySelector('.option-btn.selected');
            if (!selectedGrade) {
                alert('请选择年级');
                return;
            }
            
            step1.style.display = 'none';
            step2.style.display = 'block';
            stepDots[0].classList.remove('active');
            stepDots[1].classList.add('active');
            currentStep = 2;
        });

        // 上一步
        document.getElementById('prev-step-2').addEventListener('click', () => {
            step2.style.display = 'none';
            step1.style.display = 'block';
            stepDots[1].classList.remove('active');
            stepDots[0].classList.add('active');
            currentStep = 1;
        });

        // 完成
        document.getElementById('next-step-2').addEventListener('click', () => {
            const selectedGoals = document.querySelectorAll('input[name="goals"]:checked');
            if (selectedGoals.length === 0) {
                alert('请至少选择一个学习目标');
                return;
            }
            
            // 模拟提交成功
             alert('信息完善成功，正在生成专属AI学习计划...');
            // 跳转到正式首页
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
